name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate issue-linked branch
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        shell: bash
        run: |
          if [[ ! "$GITHUB_HEAD_REF" =~ ^(feat|fix|chore|docs|refactor|test|ci)/([0-9]+)-[a-z0-9-]+$ ]]; then
            echo "Branch must be type/issue-number-description" >&2
            exit 1
          fi
          issue="${BASH_REMATCH[2]}"
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          if ! grep -Eiq "(closes|fixes|resolves) #${issue}([^0-9]|$)" <<< "$body"; then
            echo "PR body must contain Closes #${issue}" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate web app
        run: |
          if [ ! -f package.json ]; then
            echo "Web app code has not been added yet"
            exit 0
          fi
          npm ci
          npm run lint
          npm run test
          npm run typecheck
          npm run build
