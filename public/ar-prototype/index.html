<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="LocalQuester 브라우저 AR 촬영" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>로컬 퀘스터 AR</title>
  </head>
  <body>
    <canvas id="xr-canvas" aria-label="증강현실 화면"></canvas>

    <!-- Figma: Local Quester UI / 로컬 퀘스터 복사본 (606:3810). 전체 화면 카메라, 하단 네비 없음 -->
    <div id="app">
      <video id="camera-preview" autoplay muted playsinline aria-hidden="true"></video>
      <div id="gesture-surface" aria-hidden="true"></div>
      <div id="ar-status" role="status" aria-live="polite"></div>

      <div class="camera-top">
        <div class="mode-toggle" role="radiogroup" aria-label="촬영 모드">
          <span class="mode-knob" aria-hidden="true"></span>
          <button type="button" role="radio" data-mode="video" aria-checked="false">비디오</button>
          <button type="button" role="radio" data-mode="photo" aria-checked="true">사진</button>
        </div>
        <button id="close-button" class="icon-button close" type="button" aria-label="닫기">
          <span class="close-half left"><img src="./assets/ui/icon-close-left.svg" alt="" width="8.63333" height="15.6333" /></span>
          <span class="close-half right"><img src="./assets/ui/icon-close-right.svg" alt="" width="8.63333" height="15.6333" /></span>
        </button>
      </div>

      <div class="camera-bottom">
        <button id="gallery-button" class="icon-button gallery" type="button" aria-label="갤러리에서 캐릭터 불러오기">
          <img src="./assets/ui/btn-gallery-thin.svg" alt="" width="39.216" height="39.216" />
        </button>
        <button id="shutter-button" class="icon-button shutter" type="button" aria-label="촬영">
          <img src="./assets/ui/btn-shutter-plain.svg" alt="" width="64" height="64" />
        </button>
      </div>
      <input id="gallery-input" type="file" accept="image/*" hidden />

      <div id="capture-sheet" class="capture-sheet" hidden>
        <div class="capture-card">
          <div id="capture-preview" class="capture-preview"></div>
          <div class="capture-actions">
            <button id="capture-close" class="secondary" type="button">닫기</button>
            <button id="capture-share" class="secondary" type="button">공유</button>
            <button id="capture-save" type="button">저장</button>
          </div>
        </div>
      </div>

      <!-- 갤러리 이미지에서 쓸 범위를 손가락으로 둘러 그리는 화면 -->
      <div id="cutout-sheet" class="cutout-sheet" hidden>
        <div class="cutout-header">
          <button id="cutout-cancel" class="cutout-cancel" type="button">취소</button>
          <p>캐릭터만 손가락으로 둘러 그려 주세요.<br />그리지 않으면 이미지 전체를 써요.</p>
        </div>
        <div class="cutout-stage"><canvas id="cutout-canvas" aria-label="캐릭터 범위 그리기"></canvas></div>
        <div class="cutout-actions">
          <button id="cutout-reset" class="secondary" type="button">다시 그리기</button>
          <button id="cutout-shape" class="secondary" type="button">그린 모양 그대로</button>
          <button id="cutout-remove" type="button">배경 지우기</button>
        </div>
      </div>

      <!-- 배경 제거 중에는 터치를 막아 AR이 동시에 시작되지 않게 한다 -->
      <div id="processing-overlay" class="processing-overlay" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p id="processing-text" role="status" aria-live="polite">캐릭터를 만들고 있어요…</p>
      </div>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
